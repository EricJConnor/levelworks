    <script>
      // CRITICAL: Clear all caches and update service worker on every page load
      (async function() {
        if ('serviceWorker' in navigator) {
          try {
            // Step 1: Clear ALL caches
            const cacheNames = await caches.keys();
            for (const name of cacheNames) {
              await caches.delete(name);
              console.log('Deleted cache:', name);
            }
            
            // Step 2: Get all service worker registrations
            const registrations = await navigator.serviceWorker.getRegistrations();
            
            // Step 3: Force update on all registrations
            for (const registration of registrations) {
              await registration.update();
              console.log('Updated service worker');
            }
            
            // Step 4: Register new service worker (for push notifications only)
            const reg = await navigator.serviceWorker.register('/sw.js');
            console.log('Service Worker v6 registered');
            
            // Step 5: If there's a waiting worker, skip waiting
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            
            // Step 6: Listen for new workers
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                });
              }
            });
          } catch (err) {
            console.log('Service Worker setup:', err);
          }
        }
      })();
    </script>
